buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.palantir.baseline-error-prone:gradle-baseline-error-prone:0.7.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:7.4.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.14.0'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:1.35.0'
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.18.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:5.0.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.8.0'
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.77.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.26.0'
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.6.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.89.0'
        classpath 'com.palantir.metricschema:gradle-metric-schema:0.39.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:2.28.0'
        classpath 'me.champeau.jmh:jmh-gradle-plugin:0.7.3'
        classpath 'org.revapi:gradle-revapi:1.8.0'
    }
}

apply plugin: 'com.palantir.external-publish'
apply plugin: 'com.palantir.failure-reports'
apply plugin: 'java'
apply plugin: 'org.revapi.revapi-gradle-plugin'
apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.baseline-error-prone-root'
apply plugin: 'com.palantir.consistent-versions'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.jdks'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.jdks.latest'

javaVersions {
    javaCompiler = 25
    libraryTarget = 17
    runtime = 25
}

allprojects {
    group 'com.palantir.tritium'
    version gitVersion()

    apply plugin: 'java-library'
      // installs the "processor" configuration needed for baseline-error-prone
    apply plugin: 'com.palantir.baseline-class-uniqueness'
    apply plugin: 'com.palantir.baseline-exact-dependencies'
    apply plugin: 'com.palantir.baseline-null-away'
    apply plugin: 'com.palantir.jakarta-package-alignment'
    apply plugin: 'com.palantir.java-format'

    configurations {
        testImplementationClasspath {
            exclude module: 'junit'
        }
    }

    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }

    plugins.withId('com.palantir.baseline-error-prone', {
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs += [
                '-Werror',
                '-Xlint:unchecked',
            ]

            options.errorprone {
                option('NullAway:AnnotatedPackages', 'com.palantir,com.google.common')
                option('NullAway:CheckOptionalEmptiness', 'true')
            }
        }

        plugins.withId('me.champeau.jmh') {
            // https://github.com/melix/jmh-gradle-plugin/issues/248
            tasks.jmhCompileGeneratedClasses {
                options.annotationProcessorPath = configurations.jmhAnnotationProcessor
                options.errorprone {
                    enabled = true
                    // JMH generates duplicate field names like byte p000, p001, p002
                    disable('HidingField')
                }
            }
        }
    })

    tasks.withType(Test).configureEach {
        // see https://docs.gradle.org/current/userguide/performance.html#execute_tests_in_parallel
        // and https://junit.org/junit5/docs/current/user-guide/#writing-tests-parallel-execution
        // N.B. some tests depend on system properties, so cannot be concurrently executed
        maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
        systemProperty("junit.jupiter.execution.parallel.enabled", "true")
        systemProperty("junit.jupiter.execution.parallel.mode.default", "same_thread")
        systemProperty("junit.jupiter.execution.parallel.mode.classes.default", "concurrent")
        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat "full"
            showCauses true
            showExceptions true
            showStackTraces true
        }
    }

    tasks.withType(Javadoc).configureEach {
        // suppress Javadoc doclint warnings in Java 8+
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    tasks.check.dependsOn(javadoc)
    tasks.check.dependsOn(checkImplicitDependencies)
    tasks.check.dependsOn(checkUnusedDependencies)
    tasks.check.dependsOn(checkUnusedConstraints)
}

jdks {
    daemonTarget = 21
}
